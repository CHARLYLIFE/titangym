<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FitControl Simple</title>
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 75px;
      min-height: 100vh;
    }

    header {
      background-color: var(--bg-card);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* CALENDARIO DE ASISTENCIA */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--bg-card);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .calendar-title { font-weight: 700; font-size: 1rem; }
    .month-nav { background: none; border: none; color: var(--primary); cursor: pointer; padding: 4px; }

    .weekdays-grid, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .weekdays-grid {
      margin-bottom: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .day-cell {
      background: var(--bg-card);
      border-radius: 10px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      position: relative;
      user-select: none;
    }

    .day-cell.empty { background: transparent; border: none; cursor: default; }
    .day-cell.today { border-color: var(--primary); }

    /* ESTADOS EN EL CALENDARIO */
    .day-cell.trained {
      background: rgba(34, 197, 94, 0.25);
      border-color: var(--success);
      color: #4ade80;
    }

    .day-cell.rest {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--danger);
      color: #f87171;
    }

    .mark-icon {
      font-size: 0.75rem;
      font-weight: bold;
      margin-top: 1px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* REGISTRO DE PESOS POR EJERCICIO */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exercise-item {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-info { flex: 1; }
    .ex-info h4 { font-size: 0.95rem; color: #f8fafc; margin-bottom: 2px; }
    .ex-info span { font-size: 0.75rem; color: var(--text-muted); background: var(--bg-main); padding: 2px 6px; border-radius: 4px; }

    .ex-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .weight-input {
      width: 65px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      color: var(--primary);
      font-weight: bold;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .input-label { font-size: 0.75rem; color: var(--text-muted); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      padding: 4px;
      margin-left: 6px;
    }

    .btn-add {
      width: 100%;
      background: var(--primary);
      color: var(--bg-main);
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    /* BOTTOM NAV */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .nav-item.active { color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <div class="app-title">
      <i data-lucide="dumbbell"></i> FitControl
    </div>
  </header>

  <main>
    <!-- VISTA 1: CALENDARIO -->
    <section id="view-calendar" class="view active">
      <div class="calendar-header">
        <button class="month-nav" onclick="cambiarMes(-1)"><i data-lucide="chevron-left"></i></button>
        <div class="calendar-title" id="monthTitle">Cargando...</div>
        <button class="month-nav" onclick="cambiarMes(1)"><i data-lucide="chevron-right"></i></button>
      </div>

      <div class="weekdays-grid">
        <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
      </div>

      <div class="days-grid" id="daysGrid"></div>

      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-value" id="statMes">0</div>
          <div class="stat-label">Días Entrenados (Este Mes)</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Días Entrenados</div>
        </div>
      </div>
    </section>

    <!-- VISTA 2: CONTROL DE PESOS DE EJERCICIOS -->
    <section id="view-weights" class="view">
      <div class="section-title">
        <span>📋 Mis Ejercicios y Pesos</span>
      </div>

      <div id="exerciseList"></div>

      <button class="btn-add" onclick="agregarNuevoEjercicio()">
        <i data-lucide="plus"></i> Agregar Ejercicio
      </button>
    </section>
  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav>
    <button class="nav-item active" onclick="switchTab('calendar', this)">
      <i data-lucide="calendar"></i>
      <span>Calendario</span>
    </button>
    <button class="nav-item" onclick="switchTab('weights', this)">
      <i data-lucide="clipboard-list"></i>
      <span>Mis Pesos</span>
    </button>
  </nav>

  <script>
    // --- LISTA BASE DE EJERCICIOS ---
    const defaultEjercicios = [
      { id: 'ex_1', nombre: 'Press de Banca Plano', grupo: 'Pecho', peso: 135, reps: 10 },
      { id: 'ex_2', nombre: 'Press Inclinado Mancuernas', grupo: 'Pecho', peso: 50, reps: 10 },
      { id: 'ex_3', nombre: 'Jalón al Pecho', grupo: 'Espalda', peso: 120, reps: 10 },
      { id: 'ex_4', nombre: 'Remo con Barra', grupo: 'Espalda', peso: 115, reps: 8 },
      { id: 'ex_5', nombre: 'Sentadilla Libre', grupo: 'Piernas', peso: 185, reps: 8 },
      { id: 'ex_6', nombre: 'Prensa 45°', grupo: 'Piernas', peso: 250, reps: 10 },
      { id: 'ex_7', nombre: 'Press Militar', grupo: 'Hombros', peso: 75, reps: 10 },
      { id: 'ex_8', nombre: 'Curl con Barra Z', grupo: 'Bíceps', peso: 45, reps: 10 },
      { id: 'ex_9', nombre: 'Extensiones en Polea', grupo: 'Tríceps', peso: 45, reps: 12 }
    ];

    // --- ESTADO Y ALMACENAMIENTO ---
    let currentDate = new Date();
    let activeMonth = currentDate.getMonth();
    let activeYear = currentDate.getFullYear();

    let state = {
      asistencia: JSON.parse(localStorage.getItem('fit_asistencia_v2')) || {},
      ejercicios: JSON.parse(localStorage.getItem('fit_ejercicios_v2')) || defaultEjercicios
    };

    function saveState() {
      localStorage.setItem('fit_asistencia_v2', JSON.stringify(state.asistencia));
      localStorage.setItem('fit_ejercicios_v2', JSON.stringify(state.ejercicios));
    }

    // --- PESTAÑAS ---
    function switchTab(tabId, el) {
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      el.classList.add('active');
      document.getElementById(`view-${tabId}`).classList.add('active');

      if (tabId === 'calendar') renderCalendar();
      if (tabId === 'weights') renderWeights();
    }

    // --- CALENDARIO CON 3 TOQUES (PLECA VERDE / X ROJA / LIMPIO) ---
    function renderCalendar() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      document.getElementById('monthTitle').innerText = `${monthNames[activeMonth]} ${activeYear}`;

      const firstDay = new Date(activeYear, activeMonth, 1).getDay();
      const totalDays = new Date(activeYear, activeMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        grid.appendChild(empty);
      }

      let countMes = 0;

      for (let day = 1; day <= totalDays; day++) {
        const dateKey = `${activeYear}-${String(activeMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.innerText = day;

        const status = state.asistencia[dateKey];

        if (status === 'trained') {
          cell.classList.add('trained');
          cell.innerHTML += '<div class="mark-icon">✔️</div>';
          countMes++;
        } else if (status === 'rest') {
          cell.classList.add('rest');
          cell.innerHTML += '<div class="mark-icon">❌</div>';
        }

        const today = new Date();
        if (day === today.getDate() && activeMonth === today.getMonth() && activeYear === today.getFullYear()) {
          cell.classList.add('today');
        }

        cell.onclick = () => toggleDayAttendance(dateKey);
        grid.appendChild(cell);
      }

      document.getElementById('statMes').innerText = countMes;
      document.getElementById('statTotal').innerText = Object.values(state.asistencia).filter(s => s === 'trained').length;
    }

    function cambiarMes(delta) {
      activeMonth += delta;
      if (activeMonth < 0) { activeMonth = 11; activeYear--; }
      if (activeMonth > 11) { activeMonth = 0; activeYear++; }
      renderCalendar();
    }

    // CICLO 3 TOQUES: 1: Pleca verde ✔️ | 2: X roja ❌ | 3: Limpio
    function toggleDayAttendance(dateKey) {
      const current = state.asistencia[dateKey];
      if (!current) {
        state.asistencia[dateKey] = 'trained'; // 1º Toque: Verde con Pleca
      } else if (current === 'trained') {
        state.asistencia[dateKey] = 'rest';    // 2º Toque: Rojo con X
      } else {
        delete state.asistencia[dateKey];      // 3º Toque: Limpio
      }

      saveState();
      renderCalendar();
    }

    // --- REGISTRO Y EDICIÓN DE PESOS DE EJERCICIOS ---
    function renderWeights() {
      const container = document.getElementById('exerciseList');
      container.innerHTML = '';

      if (!state.ejercicios.length) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">No tienes ejercicios guardados.</p>';
        return;
      }

      state.ejercicios.forEach((ex, idx) => {
        const item = document.createElement('div');
        item.className = 'exercise-item';
        item.innerHTML = `
          <div class="ex-info">
            <h4>${ex.nombre}</h4>
            <span>${ex.grupo}</span>
          </div>
          <div class="ex-inputs">
            <div>
              <input type="number" class="weight-input" value="${ex.peso}" onchange="updateExercise(${idx}, 'peso', this.value)">
              <span class="input-label">lbs</span>
            </div>
            <div>
              <input type="number" class="weight-input" value="${ex.reps}" onchange="updateExercise(${idx}, 'reps', this.value)">
              <span class="input-label">reps</span>
            </div>
            <button class="btn-delete" onclick="eliminarEjercicio(${idx})">
              <i data-lucide="trash-2" style="width:16px;"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });

      lucide.createIcons();
    }

    function updateExercise(idx, field, val) {
      state.ejercicios[idx][field] = parseFloat(val) || 0;
      saveState();
    }

    function agregarNuevoEjercicio() {
      const nombre = prompt("Nombre del ejercicio (ej. Sentadilla Búlgara):");
      if (!nombre || !nombre.trim()) return;

      const grupo = prompt("Grupo muscular (ej. Piernas, Pecho, Brazo):") || "General";

      state.ejercicios.push({
        id: 'ex_' + Date.now(),
        nombre: nombre.trim(),
        grupo: grupo.trim(),
        peso: 0,
        reps: 10
      });

      saveState();
      renderWeights();
    }

    function eliminarEjercicio(idx) {
      if (confirm(`¿Eliminar ${state.ejercicios[idx].nombre}?`)) {
        state.ejercicios.splice(idx, 1);
        saveState();
        renderWeights();
      }
    }

    // --- INICIALIZACIÓN ---
    lucide.createIcons();
    renderCalendar();
    renderWeights();
  </script>
</body>
</html>
